    <script>
      (function() {
        function shouldSuppress(msg, err) {
          if (!msg && err && err.message) msg = err.message;
          if (typeof msg !== 'string') return false;
          return (
            msg.indexOf('Blocked a frame with origin') !== -1 ||
            msg.indexOf('cross-origin frame') !== -1 ||
            msg.indexOf('Should not already be working') !== -1 ||
            (err && (err.name === 'SecurityError' || (err.message && err.message.indexOf('Blocked a frame') !== -1)))
          );
        }

        window.addEventListener('error', function(event) {
          var msg = event ? (event.message || '') : '';
          var err = event ? event.error : null;
          if (shouldSuppress(msg, err)) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event ? event.reason : null;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          if (
            shouldSuppress(msg, reason) ||
            msg.indexOf('popup-closed-by-user') !== -1 ||
            msg.indexOf('cancelled-popup-request') !== -1 ||
            msg.indexOf('popup-blocked') !== -1
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
